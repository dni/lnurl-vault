; lnurl-vault firmware — ESP32-S3 hardware vault for LNURLcash bearer notes
; See README.md for build/flash instructions and docs/PROTOCOL.md for the wire protocol.

[platformio]
default_envs = t-display-s3

; ---------------------------------------------------------------------------
; Firmware target: LilyGo T-Display S3 (ESP32-S3R8, 170x320 ST7789 LCD, 2 buttons)
; ---------------------------------------------------------------------------
[env:t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = espidf
board_build.partitions = partitions.csv
; No explicit sdkconfig_defaults key here on purpose — PlatformIO's espidf
; builder auto-discovers a project-root file literally named
; sdkconfig.defaults by convention (confirmed against builder/frameworks/
; espidf.py: is_cmake_reconfigure_required() checks that exact path). An
; earlier version of this file set `sdkconfig_defaults = sdkconfig.defaults`
; explicitly, which is not a recognized option for this platform version —
; harmless (the file was still picked up by convention either way) but
; PlatformIO logs "Warning! Ignore unknown configuration option" for it.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; No lib_deps here on purpose. `ricmoo/QRCode` (qr_display.c's QR encoder)
; IS in the PlatformIO library index (`pio pkg search qrcode` finds it), but
; empirically confirmed in this environment: adding
; `lib_deps = ricmoo/QRCode@0.0.1` here makes a real `pio run` log
; "LDF: ... Found 0 compatible libraries" — LDF filters it out for
; framework=espidf specifically. Root cause, also confirmed directly (not
; guessed): `ricmoo/QRCode`'s manifest is an old Arduino-style
; library.properties (`architectures=*`), which PlatformIO's LDF doesn't
; treat as declaring espidf compatibility — there's no library.json with a
; `frameworks`/`platforms` key for it to check instead. This is NOT a
; blanket "LDF never engages for framework=espidf" limitation, despite an
; earlier version of this comment claiming that: a library that DOES ship a
; proper library.json (e.g. `davylandman/Monocypher`, which src/ota/ vendors
; by hand instead — see its own header comment for why, unrelated to LDF)
; gets found and pulled in here just fine (`Found 1 compatible libraries`,
; confirmed the same way). A git dependency in src/idf_component.yml was
; tried too and also fails, for an unrelated reason: ESP-IDF's component
; manager requires the target repo to already be component-shaped (its own
; CMakeLists.txt via idf_component_register), and ricmoo/QRCode's repo
; isn't — confirmed via the exact CMake error ("Directory
; '.../managed_components/qrcode' does not contain a component"). Manual
; vendoring (see README.md's Build & flash section) is the mechanism that
; actually works for this specific library.
; -Wno-unknown-pragmas/-Wno-type-limits: the vendored QR library (see
; qr_display.c's header comment) trips both under this project's -Wall
; -Wextra plus ESP-IDF's own global -Werror — a Clang-ism `#pragma mark`
; GCC doesn't know, and an always-false unsigned-value comparison. Both
; confirmed by an actual build, not guessed. (A third issue in that same
; library — bool/true/false becoming real C23 keywords under this ESP-IDF
; version's hardcoded, unconditional -std=gnu23 for chip targets, which no
; build_flags override here can beat since ESP-IDF's own -std= comes later
; on the actual compile command — is fixed by patching the vendored header
; itself at vendor time instead; see qr_display.c's header comment, not a
; build_flags concern.)
build_flags =
    -Wall
    -Wextra
    -Wno-unknown-pragmas
    -Wno-type-limits
    -DLNURLVAULT_FW_VERSION=\"0.1.0\"
    -DLNURLVAULT_BOARD_T_DISPLAY_S3

; ---------------------------------------------------------------------------
; Firmware target: LilyGo T-Display (the ORIGINAL, classic ESP32-D0WD -- not
; the S3 above). ST7789 240x135 over SPI, two buttons, and a CH9102 USB-UART
; bridge instead of native USB.
;
; This board cannot exercise the S3's i80 parallel display bus (it has no
; LCD_CAM peripheral) and cannot present a native USB-CDC device (no USB-OTG),
; so it is not a substitute for testing the S3 build. It exists because it can
; exercise the parts that matter most and are hardest to reason about without
; hardware: the two-button gesture state machine against real contact bounce,
; a QR code an actual phone has to scan, NVS across real power cycles, and BLE
; reassembly against a real central.
;
; Web Serial still works here -- navigator.serial sees a CH9102 bridge exactly
; as it sees a native CDC device -- so the wire protocol is testable end to end.
; ---------------------------------------------------------------------------
[env:t-display]
platform = espressif32
board = lilygo-t-display
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wextra
    -Wno-unknown-pragmas
    -Wno-type-limits
    -DLNURLVAULT_FW_VERSION=\"0.1.0\"
    -DLNURLVAULT_BOARD_T_DISPLAY
    -DLNURLVAULT_QR_SELFTEST
; Add -DLNURLVAULT_DISPLAY_SELFTEST to paint a boot-time panel test pattern
; (src/ui/display_selftest.c). It isolates colour order, inversion, rotation,
; mirroring and RAM offset one at a time -- which is how the mirror settings
; above were established, in three flash cycles rather than by inspection.

; ---------------------------------------------------------------------------
; Native unit tests for the portable core (sha256 / json / vault state machine
; / dispatcher). No ESP-IDF, no hardware — runs on the host with plain gcc.
; Kept as a PlatformIO env for convenience; `make test` (see test/native/) is
; the fastest path and needs neither PlatformIO nor a board.
; ---------------------------------------------------------------------------
; json.c links against the system cJSON library (`pacman -S cjson` /
; `apt-get install libcjson-dev`) — same upstream version the firmware pulls
; via src/idf_component.yml's espressif/cjson managed component. The `!`
; prefix runs pkg-config at build time for the right -I/-l flags rather than
; hardcoding an install path that varies by distro.
[env:native]
platform = native
build_flags =
    -std=c11
    -Wall
    -Wextra
    -Isrc/proto
    -Isrc/vault
    -Itest/native
    !pkg-config --cflags --libs libcjson
build_src_filter =
    +<*>
    -<transport>
    -<ui>
    -<storage>
    -<main.c>
    -<vault_lock.c>
