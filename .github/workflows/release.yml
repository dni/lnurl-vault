# Builds firmware and publishes it as a GitHub Release on every `v*` tag,
# then (always, tag or not) regenerates and deploys the web installer to
# GitHub Pages from whatever releases currently exist. See webinstaller/ and
# README.md's "Releases & web installer" section. Confirmed to actually run
# end to end (a real tagged release has gone through this workflow) — see
# README.md's "Status" section.
#
# "Sign firmware for OTA" below requires the OTA_SIGNING_SEED repository
# secret (Settings -> Secrets and variables -> Actions) — a hex-encoded
# 32-byte ed25519 seed from `python3 tools/ota_push.py keygen`. Fails the
# whole release closed if that secret isn't set, deliberately: an
# unreachable signing key should stop a release, not silently ship one that
# devices in the field can never install over OTA. See README.md's "OTA
# firmware updates" section and tools/ota_push.py for the full key-custody
# story (adapted from forgesworn/heartwood-esp32's docs/ota-signing.md).
#
# One-time manual setup this workflow can't do for you: Settings -> Pages ->
# Source: "GitHub Actions" (this repo's github.io URL only starts serving
# once that's set), the OTA_SIGNING_SEED secret above, and confirm
# dist/manifest.json's "path"/"offset" values still match partitions.csv if
# you ever change it.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-firmware:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned, not --upgrade: an unpinned install means the toolchain that
      # builds a release can change with no commit in this repo, and 6.1.19
      # is the version every hardware result in README.md's Status section
      # was produced against. platformio.ini pins the platform (and with it
      # the compiler and IDF) for the same reason.
      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      # Only tools/ota_push.py's `sign` subcommand needs this — cryptography
      # for ed25519, not pyserial (nothing here talks to a device).
      - name: Install OTA signing dependencies
        run: pip install 'cryptography==50.0.0'

      # See ci.yml's identical step and qr_display.c's header comment: this
      # library isn't (and can't cleanly be) an automatic PlatformIO/
      # ESP-IDF dependency, so it's fetched by hand here, with the one-line
      # patch its qrcode.h needs to build under this project's ESP-IDF
      # version.
      # Pinned to a commit and verified by hash -- see the script. This used
      # to be an inline `git clone --depth 1`, i.e. whatever the default
      # branch pointed at when the build ran, compiled into a firmware that
      # holds bearer secrets.
      - name: Vendor QR library (ricmoo/QRCode, pinned)
        run: ./tools/vendor_qrcode.sh src/ui

      # LNURLVAULT_FW_VERSION is read by tools/fw_version.py and compiled in,
      # so get_info reports the tag this was actually cut from. It used to be
      # hardcoded to 0.1.0 in platformio.ini, which meant every release ever
      # built reported 0.1.0 -- worse than reporting nothing, because a bug
      # report quoting it sends you to the wrong commit.
      # BOTH supported boards. Releases used to build only the S3, so anyone
      # holding a classic T-Display -- a target this repo has supported since
      # the board seam landed -- got no installer image and no OTA image at
      # all, with nothing saying so.
      - name: Build firmware
        run: pio run -e t-display-s3 -e t-display
        env:
          LNURLVAULT_FW_VERSION: ${{ github.ref_name }}

      # The S3's artefacts keep their plain names, so existing links and any
      # consumer of an older release still resolve. The classic board's are
      # suffixed.
      #
      # ota_data_initial.bin is collected too, which the merge below used to
      # omit. PlatformIO flashes it on every upload for a reason: otadata
      # decides which slot the bootloader starts. Leaving whatever was already
      # on the chip means a full-flash install onto a board that had
      # previously taken an OTA can boot a slot this install never wrote.
      - name: Collect build outputs
        run: |
          set -euo pipefail
          mkdir -p dist
          collect() {
            local env_name="$1" suffix="$2" d=".pio/build/$1"
            cp "$(find "$d" -maxdepth 1 -name 'bootloader.bin' | head -1)" "dist/bootloader${suffix}.bin"
            cp "$(find "$d" -maxdepth 1 -name 'partition*.bin' | head -1)" "dist/partitions${suffix}.bin"
            cp "$(find "$d" -maxdepth 1 -name 'ota_data_initial.bin' | head -1)" "dist/otadata${suffix}.bin"
            cp "$(find "$d" -maxdepth 1 -name 'firmware.bin' | head -1)" "dist/firmware${suffix}.bin"
          }
          collect t-display-s3 ""
          collect t-display "-t-display"
          ls -la dist

      # Signs dist/firmware.bin — the plain app image esp_ota_write() writes
      # to the OTA partition, NOT dist/merged-firmware.bin below (that's a
      # bootloader+partition-table+app image for the *initial* full flash,
      # which OTA never touches). See docs/PROTOCOL.md's ota_begin and
      # tools/ota_push.py's own docstring.
      - name: Sign firmware for OTA
        run: |
          set -euo pipefail
          if [ -z "${OTA_SIGNING_SEED:-}" ]; then
            echo "::error::OTA_SIGNING_SEED secret is not set. Generate one with" \
                 "'python3 tools/ota_push.py keygen', paste the printed public key into" \
                 "src/ota/release_key.c's OTA_RELEASE_PUBKEY, and set the printed hex seed" \
                 "as this repo's OTA_SIGNING_SEED secret. See README.md's" \
                 "'OTA firmware updates' section." >&2
            exit 1
          fi
          seed_file="$(mktemp)"
          trap 'rm -f "$seed_file"' EXIT
          python3 -c "import sys; open(sys.argv[1], 'wb').write(bytes.fromhex(sys.argv[2]))" \
            "$seed_file" "$OTA_SIGNING_SEED"
          # Before signing anything: does this seed actually correspond to the
          # public key the firmware being released has compiled into it?
          # Nothing connected those two, so a rotated key or a mistyped secret
          # produced a release that built, signed and published cleanly and
          # then failed on somebody's device with bad_signature -- after the
          # release was public. Fails the release instead.
          python3 tools/check_release_key.py --seed "$seed_file"
          for img in dist/firmware.bin dist/firmware-t-display.bin; do
            python3 tools/ota_push.py sign --seed "$seed_file" --image "$img" --out "$img.sig"
            echo "$img -> $(cat "$img.sig")"
          done
        env:
          OTA_SIGNING_SEED: ${{ secrets.OTA_SIGNING_SEED }}

      # esp-web-tools' own docs are explicit that it can't patch SPI flash
      # parameters on the fly when writing multiple separate binary parts
      # over Web Serial, and that ESP-IDF firmware needs to be pre-merged
      # with esptool first (confirmed by fetching those docs directly, not
      # assumed) — a real symptom of skipping this is exactly "the web
      # installer reports success, but the board never boots the flashed
      # firmware, stuck showing the ROM's own bootloader instead". The
      # --flash_mode/--flash_freq/--flash_size values here must match what
      # `pio run -t upload`'s own esptool.py invocation uses for this board
      # — verified directly (`pio run -t upload -v`) rather than guessed:
      # dio / 80m / 16MB.
      #
      # Deliberately invoking the exact esptool.py PlatformIO already
      # downloaded for this build (under ~/.platformio/packages/
      # tool-esptoolpy/), rather than a separately `pip install`ed esptool:
      # the latter can resolve a much newer major version (v5, confirmed —
      # renamed this very command to `merge-bin` and restructured its
      # flags) that isn't the one this step was actually tested against.
      # Per-board, because the parameters are NOT the same and getting them
      # wrong produces an image that flashes cleanly and never boots. Both
      # sets were read off a real `pio run -t upload -v` for that board rather
      # than assumed:
      #
      #   ESP32-S3   dio 80m 16MB   bootloader at 0x0
      #   ESP32      dio 40m 16MB   bootloader at 0x1000
      #
      # That bootloader offset is the one that bites: it differs by chip, and
      # an ESP32 image built with the S3's 0x0 is silently unbootable.
      #
      # otadata is included now. See "Collect build outputs" above for why.
      #
      # Deliberately invoking the exact esptool.py PlatformIO already
      # downloaded for this build, rather than a separately `pip install`ed
      # esptool: the latter can resolve a much newer major version (v5,
      # confirmed -- renamed this very command to `merge-bin` and restructured
      # its flags) that isn't the one this step was tested against.
      - name: Merge into single flashable images
        run: |
          set -euo pipefail
          ESPTOOL="$(find "$HOME/.platformio/packages/tool-esptoolpy" -maxdepth 1 -name 'esptool.py')"
          python3 "$ESPTOOL" --chip esp32s3 merge_bin \
            -o dist/merged-firmware.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 dist/bootloader.bin \
            0x8000 dist/partitions.bin \
            0x2b000 dist/otadata.bin \
            0x30000 dist/firmware.bin
          python3 "$ESPTOOL" --chip esp32 merge_bin \
            -o dist/merged-firmware-t-display.bin \
            --flash_mode dio --flash_freq 40m --flash_size 16MB \
            0x1000 dist/bootloader-t-display.bin \
            0x8000 dist/partitions-t-display.bin \
            0x2b000 dist/otadata-t-display.bin \
            0x30000 dist/firmware-t-display.bin
          ls -la dist

      - name: Generate manifest.json
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Single merged part at offset 0 — see "Merge into a single
          # flashable image" above for why this isn't three separate parts
          # the way an earlier version of this workflow did it.
          cat > dist/manifest.json <<EOF
          {
            "name": "lnurl-vault",
            "version": "${VERSION}",
            "new_install_prompt_erase": true,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "merged-firmware.bin", "offset": 0 }
                ]
              },
              {
                "chipFamily": "ESP32",
                "parts": [
                  { "path": "merged-firmware-t-display.bin", "offset": 0 }
                ]
              }
            ]
          }
          EOF
          cat dist/manifest.json

      # Every published artifact, hashed. firmware.bin also carries an
      # ed25519 signature (firmware.bin.sig) because the device itself must
      # verify it before an OTA install; these hashes are the other half, for
      # a human or a mirror checking that what they downloaded is what was
      # built. In particular merged-firmware.bin -- the image the web
      # installer actually flashes over USB -- has no signature of its own,
      # since nothing on the device verifies a full-flash image, so a checksum
      # is the only integrity statement it gets.
      #
      # Generated last, so it covers everything the earlier steps wrote.
      - name: Checksum the release artifacts
        run: |
          set -euo pipefail
          cd dist
          sha256sum bootloader.bin partitions.bin firmware.bin \
                    firmware.bin.sig merged-firmware.bin \
                    bootloader-t-display.bin partitions-t-display.bin \
                    firmware-t-display.bin firmware-t-display.bin.sig \
                    merged-firmware-t-display.bin manifest.json > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/bootloader.bin dist/partitions.bin dist/firmware.bin \
            dist/firmware.bin.sig dist/merged-firmware.bin \
            dist/bootloader-t-display.bin dist/partitions-t-display.bin \
            dist/firmware-t-display.bin dist/firmware-t-display.bin.sig \
            dist/merged-firmware-t-display.bin \
            dist/SHA256SUMS dist/manifest.json

  deploy-pages:
    needs: [build-firmware]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # THE WEB INSTALLER HAS NEVER WORKED, and this step is why. Two faults,
      # both of which this fixes and then checks:
      #
      # 1. merged-firmware.bin was not in the pattern list, and it is the ONLY
      #    file manifest.json references. Even a perfect download left the
      #    installer pointing at a file that was never published to the site.
      # 2. The step succeeded while producing nothing. The deployed artifact
      #    for v0.0.4 contained an EMPTY firmware/ directory -- index.html,
      #    favicon.svg, releases.json, console.html, and firmware/ with no
      #    contents -- so every release offered by the page 404s, and has for
      #    every release ever cut. `for tag in $(gh release list ...)` cannot
      #    fail the script when the substitution comes back empty, so a
      #    transient API failure silently ships a broken installer that still
      #    lists releases and still looks fine.
      #
      # So it now verifies its own output and fails the job rather than
      # deploying a page that cannot install anything. A release that does not
      # install is worse than no release: it looks like it worked.
      - name: Fetch every release's firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/firmware

          tags="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
          if [ -z "$tags" ]; then
            echo "::error::no releases returned -- refusing to deploy an installer with nothing to install" >&2
            exit 1
          fi

          for tag in $tags; do
            dir="site/firmware/${tag}"
            mkdir -p "$dir"
            # || true: older releases predate some of these assets, and a
            # missing pattern is fatal to `gh release download`. The check
            # below is what decides whether a release is actually usable.
            gh release download "$tag" --dir "$dir" \
              --pattern 'bootloader*.bin' \
              --pattern 'partitions*.bin' \
              --pattern 'firmware*.bin' \
              --pattern 'merged-firmware*.bin' \
              --pattern 'manifest.json' \
              --clobber || true
          done

          # Every release the page OFFERS must be installable -- but an old
          # release that cannot be made installable must not block new ones.
          # v0.0.2 predates merged-firmware.bin entirely, so failing on any
          # broken manifest would wedge releases forever on history nobody can
          # change. Drop those from the page instead, and fail only if the
          # newest release is unusable, because then there is genuinely
          # nothing to install.
          usable=""
          for tag in $tags; do
            dir="site/firmware/${tag}"
            if [ ! -f "$dir/manifest.json" ]; then
              echo "::warning::${tag}: no manifest.json -- not offered"
              rm -rf "$dir"
              continue
            fi
            missing=""
            for part in $(jq -r '.builds[].parts[].path' "$dir/manifest.json"); do
              [ -f "$dir/$part" ] || missing="$missing $part"
            done
            if [ -n "$missing" ]; then
              echo "::warning::${tag}: manifest references missing asset(s) --${missing} -- not offered"
              rm -rf "$dir"
              continue
            fi
            usable="$usable $tag"
          done

          if [ -z "$usable" ]; then
            echo "::error::no release is installable; refusing to deploy an installer that cannot install" >&2
            exit 1
          fi

          newest="$(echo "$tags" | head -1)"
          case " $usable " in
            *" $newest "*) ;;
            *) echo "::error::the newest release ${newest} is not installable" >&2; exit 1 ;;
          esac

          # releases.json lists only what the page can actually offer, so the
          # dropdown never presents a version that 404s on selection.
          gh release list --limit 100 --json tagName,name,publishedAt \
            | jq --argjson keep "$(printf '%s\n' $usable | jq -R . | jq -s .)" \
                 '[.[] | select(.tagName as $t | $keep | index($t))] | sort_by(.publishedAt) | reverse' \
            > site/releases.json
          cat site/releases.json
          echo "deployed firmware tree:"
          find site/firmware -type f | sort

      - name: Assemble the web installer page
        run: cp -r webinstaller/. site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
